# pg-18-partman-timescale: Example PostgreSQL configuration overrides
# Copy and modify this file, then mount to /etc/postgresql/conf.d/

# =============================================================================
# Memory Settings
# =============================================================================
# Recommended calculations:
#   shared_buffers = 25% of total RAM (max ~8GB for most workloads)
#   effective_cache_size = 75% of total RAM
#   work_mem = (RAM - shared_buffers) / (max_connections * 2)
#   maintenance_work_mem = RAM / 8 (max 2GB)

# shared_buffers = 256MB
# effective_cache_size = 768MB
# work_mem = 16MB
# maintenance_work_mem = 128MB

# =============================================================================
# WAL Settings
# =============================================================================
# wal_buffers = 16MB
# checkpoint_completion_target = 0.9
# max_wal_size = 2GB
# min_wal_size = 1GB

# =============================================================================
# Connection Settings
# =============================================================================
# max_connections = 100

# =============================================================================
# Logging (recommended for production)
# =============================================================================
# For containerized environments, log to stderr (captured by Docker)
# log_destination = 'stderr'
# log_statement = 'ddl'
# log_min_duration_statement = 500
# log_checkpoints = on
# log_connections = on
# log_disconnections = on
# log_lock_waits = on
# log_temp_files = 0
# log_autovacuum_min_duration = 0

# =============================================================================
# TimescaleDB Settings
# =============================================================================
# timescaledb.max_background_workers = 8
# timescaledb.license = 'apache'

# =============================================================================
# pg_partman Background Worker
# =============================================================================
# Interval in seconds between maintenance runs (default: 3600)
# pg_partman_bgw.interval = 3600

# Database(s) to run maintenance on (comma-separated for multiple)
# pg_partman_bgw.dbname = 'postgres'

# Role to run maintenance as
# pg_partman_bgw.role = 'postgres'

# =============================================================================
# pg_stat_statements Settings
# =============================================================================
# pg_stat_statements.max = 10000
# pg_stat_statements.track = all
